<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent回答转文本文件</title>
<!-- CDN 依赖 -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
  :root {
    --primary: #1F4E79;
    --secondary: #2E75B6;
    --accent: #C55A11;
    --highlight: #548235;
    --gray: #595959;
    --light-bg: #F2F7FB;
    --callout-bg: #FFF3E0;
    --conclusion-bg: #E8F5E9;
    --border: #D0D7DE;
    --bg: #ffffff;
    --sidebar-bg: #f6f8fa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--gray);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  /* 顶部栏 */
  header {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    flex-shrink: 0;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  .toolbar { display: flex; gap: 8px; }
  .btn {
    background: rgba(255,255,255,0.15);
    color: white;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s;
  }
  .btn:hover { background: rgba(255,255,255,0.3); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-export { background: var(--accent); border-color: var(--accent); }
  .btn-export:hover { background: #d96a1f; }
  /* 主体 */
  main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  /* 左侧输入 */
  .input-panel {
    width: 45%;
    min-width: 320px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 12px;
    overflow: auto;
  }
  .panel-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .upload-area {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: white;
  }
  .upload-area:hover { border-color: var(--secondary); background: var(--light-bg); }
  .upload-area.dragover { border-color: var(--secondary); background: var(--light-bg); }
  .upload-area p { font-size: 12px; color: var(--gray); margin-top: 4px; }
  #fileInput { display: none; }
  #inputText {
    flex: 1;
    min-height: 200px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 13px;
    line-height: 1.6;
    outline: none;
    background: white;
    color: #333;
    overflow: auto;
    white-space: pre-wrap;
  }
  #inputText:empty:before { content: attr(data-placeholder); color: #8c959f; white-space: pre-line; }
  #inputText:focus { border-color: var(--secondary); box-shadow: 0 0 0 3px rgba(46,117,182,0.1); }
  /* 粘贴时保留语义结构，但统一控制字号与段距，避免继承 WPS 的外观样式。 */
  #inputText h1, #inputText h2, #inputText h3 { color: #1F4E79; margin: 0.8em 0 0.35em; line-height: 1.35; }
  #inputText h1 { font-size: 1.35em; } #inputText h2 { font-size: 1.18em; } #inputText h3 { font-size: 1.05em; }
  #inputText p { margin: 0 0 0.55em; line-height: 1.6; }
  #inputText ul, #inputText ol { margin: 0.25em 0 0.6em 1.4em; padding: 0; line-height: 1.55; }
  #inputText li { margin: 0.15em 0; }
  #inputText blockquote { margin: 0.5em 0; padding-left: 0.75em; border-left: 3px solid #9bb9d5; color: #54606b; }
  #inputText pre { margin: 0.5em 0; padding: 0.65em; background: #f6f8fa; border-radius: 4px; white-space: pre-wrap; }
  #inputText code { background: #f1f3f5; padding: 0.05em 0.25em; border-radius: 3px; font-family: "SF Mono", Consolas, monospace; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select#template {
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    background: white;
  }
  .clear-btn {
    background: transparent;
    color: var(--gray);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .clear-btn:hover { background: #f0f0f0; }
  /* 右侧预览 */
  .preview-panel {
    flex: 1;
    overflow: auto;
    padding: 24px 32px;
    background: white;
  }
  .preview-content {
    max-width: 720px;
    margin: 0 auto;
  }
  .preview-content h1 {
    font-size: 22px;
    color: var(--primary);
    margin: 20px 0 12px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--primary);
    font-weight: 700;
  }
  .preview-content h2 {
    font-size: 18px;
    color: var(--secondary);
    margin: 18px 0 10px;
    font-weight: 600;
  }
  .preview-content h3 {
    font-size: 15px;
    color: var(--accent);
    margin: 14px 0 8px;
    font-weight: 600;
  }
  .preview-content p {
    font-size: 14px;
    line-height: 1.8;
    color: var(--gray);
    margin-bottom: 8px;
  }
  .preview-content .conclusion {
    background: var(--conclusion-bg);
    border-left: 4px solid var(--highlight);
    padding: 10px 14px;
    margin: 10px 0;
    border-radius: 0 6px 6px 0;
    font-weight: 600;
    color: #2E5C1A;
  }
  .preview-content .callout {
    background: var(--callout-bg);
    border-left: 4px solid var(--accent);
    padding: 10px 14px;
    margin: 8px 0;
    border-radius: 0 6px 6px 0;
    color: var(--accent);
    font-style: italic;
  }
  .preview-content .key-concept {
    background: var(--callout-bg);
    border-left: 4px solid var(--accent);
    padding: 10px 14px;
    margin: 8px 0;
    border-radius: 0 6px 6px 0;
    font-weight: 700;
    color: var(--accent);
  }
  .preview-content .arrow-flow {
    text-align: center;
    background: var(--light-bg);
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    font-weight: 600;
    color: var(--primary);
    line-height: 2;
  }
  .preview-content .arrow-flow .arrow { color: var(--secondary); font-size: 16px; }
  .preview-content ul, .preview-content ol {
    margin: 8px 0 8px 24px;
    font-size: 14px;
    line-height: 1.8;
    color: var(--gray);
  }
  .preview-content li { margin-bottom: 4px; }
  .preview-content code {
    background: #f0f0f0;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 13px;
  }
  .preview-content pre {
    background: #f6f8fa;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .preview-content pre code { background: none; padding: 0; }
  .preview-content strong { color: var(--primary); font-weight: 700; }
  .preview-content .highlight-word {
    background: #FFF59D;
    padding: 1px 4px;
    border-radius: 3px;
    font-weight: 600;
    color: #B71C1C;
  }
  .preview-content hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 16px 0;
  }
  .placeholder {
    text-align: center;
    color: #aaa;
    font-size: 14px;
    padding: 60px 20px;
  }
  /* 状态栏 */
  .statusbar {
    background: var(--sidebar-bg);
    border-top: 1px solid var(--border);
    padding: 6px 16px;
    font-size: 11px;
    color: var(--gray);
    display: flex;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .statusbar .stat { color: var(--secondary); font-weight: 600; }
  /* Toast */
  #toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 9999;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }
  /* 离线提示 */

  /* ===== 普通文档风 (plain) ===== */
  [data-template="plain"] {
    background: transparent;
  }
  [data-template="plain"] h1 {
    color: #1F4E79; border-bottom: none; font-weight: 700; font-size: 22px;
  }
  [data-template="plain"] h2 {
    color: #1F4E79; font-weight: 700; font-size: 18px;
  }
  [data-template="plain"] h3 {
    color: #1F4E79; font-weight: 700; font-size: 15px;
  }
  [data-template="plain"] p { color: #595959; }
  [data-template="plain"] .conclusion {
    background: #F2F7FB; border-left: none; border-radius: 0;
    color: #1F4E79; font-style: italic; font-weight: 400;
  }
  [data-template="plain"] .callout {
    background: #F2F7FB; border-left: none; border-radius: 0;
    color: #1F4E79; font-style: italic;
  }
  [data-template="plain"] .key-concept {
    background: #FFF3E0; border-left: none; border-radius: 0;
    color: #C55A11; font-weight: 700;
  }
  [data-template="plain"] .arrow-flow {
    background: transparent; border-radius: 0;
    color: #1F4E79; font-weight: 700;
  }
  [data-template="plain"] .arrow-flow .arrow { color: #2E75B6; }
  [data-template="plain"] strong { color: #1F4E79; }
  [data-template="plain"] .highlight-word { background: none; color: inherit; font-weight: 600; }

  /* ===== 易读重排风 (kami) ===== */
  [data-template="kami"] {
    background: transparent;
  }
  [data-template="kami"] h1 {
    color: #1B365D; border-bottom: none; font-weight: 500; font-size: 22px;
    font-family: "Source Han Serif SC", "Noto Serif CJK SC", "STSong", "SimSun", Georgia, serif;
    line-height: 1.3;
  }
  [data-template="kami"] h2 {
    color: #1B365D; font-weight: 500; font-size: 18px;
    font-family: "Source Han Serif SC", "Noto Serif CJK SC", "STSong", "SimSun", Georgia, serif;
    line-height: 1.3;
  }
  [data-template="kami"] h3 {
    color: #1B365D; font-weight: 500; font-size: 15px;
    font-family: "Source Han Serif SC", "Noto Serif CJK SC", "STSong", "SimSun", Georgia, serif;
    line-height: 1.3;
  }
  [data-template="kami"] p {
    color: #3D3D3A; line-height: 1.55; font-weight: 400;
  }
  [data-template="kami"] .conclusion {
    background: #EEF2F7; border-left: none; border-radius: 0;
    color: #1B365D; font-style: italic; font-weight: 400; line-height: 1.5;
  }
  [data-template="kami"] .callout {
    background: #EEF2F7; border-left: none; border-radius: 0;
    color: #1B365D; font-style: italic; font-weight: 400;
  }
  [data-template="kami"] .key-concept {
    background: #FFF3E0; border-left: none; border-radius: 0;
    color: #C55A11; font-weight: 500;
  }
  [data-template="kami"] .arrow-flow {
    background: transparent; border-radius: 0;
    color: #1B365D; font-weight: 500; line-height: 1.8;
  }
  [data-template="kami"] .arrow-flow .arrow { color: #6B7280; }
  [data-template="kami"] strong { color: #1B365D; font-weight: 500; }
  [data-template="kami"] .highlight-word { background: none; color: inherit; font-weight: 500; }
  [data-template="kami"] ul, [data-template="kami"] ol { color: #3D3D3A; line-height: 1.55; }
  [data-template="kami"] code {
    background: #EFEEE6; border: 1px solid #E8E6DC; border-radius: 3px;
  }
  [data-template="kami"] pre {
    background: #EFEEE6; border: 1px solid #E8E6DC; border-radius: 3px;
  }

  .offline-warning {
    background: #FFF3CD;
    border: 1px solid #FFC107;
    color: #856404;
    padding: 8px 16px;
    font-size: 12px;
    text-align: center;
    display: none;
  }

  /* ===== 表格样式 ===== */
  .preview-content table {
    border-collapse: collapse;
    width: 100%;
    margin: 12px 0;
    font-size: 13px;
  }
  .preview-content th {
    background: var(--primary);
    color: white;
    padding: 8px 12px;
    text-align: left;
    border: 1px solid var(--primary);
    font-weight: 600;
  }
  .preview-content td {
    padding: 6px 12px;
    border: 1px solid var(--border);
    color: var(--gray);
  }
  .preview-content tr:nth-child(even) td {
    background: #f9fafb;
  }

  /* plain 模板表格 */
  [data-template="plain"] table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 13px; }
  [data-template="plain"] th { background: #F2F7FB; color: #1F4E79; padding: 8px 12px; border: 1px solid #D0D7DE; font-weight: 700; }
  [data-template="plain"] td { padding: 6px 12px; border: 1px solid #D0D7DE; color: #595959; }
  [data-template="plain"] tr:nth-child(even) td { background: #FAFBFC; }

  /* kami 模板表格 */
  [data-template="kami"] table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 13px; }
  [data-template="kami"] th { background: #EEF2F7; color: #1B365D; padding: 8px 12px; border: 1px solid #E8E6DC; font-weight: 500; font-family: "Source Han Serif SC", "Noto Serif CJK SC", "STSong", "SimSun", Georgia, serif; }
  [data-template="kami"] td { padding: 6px 12px; border: 1px solid #E8E6DC; color: #3D3D3A; }
  [data-template="kami"] tr:nth-child(even) td { background: #F5F4ED; }

  /* 输入区表格（富文本粘贴后可见） */
  #inputText table { border-collapse: collapse; width: 100%; margin: 0.5em 0; font-size: 0.9em; }
  #inputText th, #inputText td { border: 1px solid #d0d7de; padding: 4px 8px; }
  #inputText th { background: #f2f7fb; font-weight: 600; }
</style>
</head>
<body>

<div class="offline-warning" id="offlineWarning">
  ⚠️ CDN 库加载失败，已降级为纯文本模式。DOCX/PDF 导出可能不可用，请检查网络连接后刷新。
</div>

<header>
  <h1>Agent 回答转文本文件</h1>
  <div class="toolbar">
    <button class="btn btn-export" id="exportDocx" onclick="exportDocx()" disabled>DOCX</button>
    <button class="btn btn-export" id="exportPdf" onclick="exportPdf()" disabled>PDF</button>
    <button class="btn btn-export" id="exportHtml" onclick="exportHtml()" disabled>HTML</button>
    <button class="btn btn-export" id="exportMd" onclick="exportMd()" disabled>Markdown</button>
  </div>
</header>

<main>
  <div class="input-panel">
    <div class="panel-title">
      <span>输入区</span>
      <button class="clear-btn" onclick="clearAll()">清空</button>
    </div>
    <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
      <div style="font-size:24px;">📄</div>
      <p><strong>点击上传</strong> 或拖拽 Markdown / TXT 文件到此处</p>
      <input type="file" id="fileInput" accept=".md,.txt,.markdown" onchange="handleFile(event)">
    </div>
    <div id="inputText" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="或在此处粘贴 Agent 的回答内容…&#10;&#10;会保留标题、加粗、列表和代码；字号、字体与行距会统一为紧凑版式。"></div>
    <div class="controls">
      <select id="template">
        <option value="academic">学术阅读模板（推荐）</option>
        <option value="clean">简洁模板</option>
        <option value="plain">普通文档风</option>
        <option value="kami">易读重排风</option>
      </select>
      <span style="font-size:11px;color:#999;">| 优先保留：标题 / 粗体 / 列表 / 代码；智能识别仅补充纯文本结构</span>
    </div>
  </div>

  <div class="preview-panel">
    <div class="preview-content" id="preview">
      <div class="placeholder">
        在左侧粘贴或上传 Agent 回答<br>右侧将实时显示增强排版后的预览
      </div>
    </div>
  </div>
</main>

<div class="statusbar">
  <span id="statusLeft">就绪</span>
  <span id="statusRight">识别：0 标题 / 0 结论 / 0 箭头流</span>
</div>

<div id="toast"></div>

<script>
// ============ 全局状态 ============
let parsedBlocks = [];
let stats = { headings: 0, conclusions: 0, arrowFlows: 0 };

// ============ CDN 可用性检测 ============
window.addEventListener('load', function() {
  setTimeout(function() {
    if (typeof marked === 'undefined' || typeof saveAs === 'undefined') {
      document.getElementById('offlineWarning').style.display = 'block';
      showToast('部分 CDN 库加载失败，功能受限');
    }
  }, 3000);
});

// ============ Toast 提示 ============
function showToast(msg, duration) {
  duration = duration || 2500;
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(function() { toast.classList.remove('show'); }, duration);
}

// ============ 文件上传处理 ============
var uploadArea = document.getElementById('uploadArea');
uploadArea.addEventListener('dragover', function(e) {
  e.preventDefault();
  uploadArea.classList.add('dragover');
});
uploadArea.addEventListener('dragleave', function(e) {
  uploadArea.classList.remove('dragover');
});
uploadArea.addEventListener('drop', function(e) {
  e.preventDefault();
  uploadArea.classList.remove('dragover');
  if (e.dataTransfer.files.length > 0) {
    handleFile({ target: { files: e.dataTransfer.files } });
  }
});

function handleFile(event) {
  var file = event.target.files[0];
  if (!file) return;
  var ext = file.name.split('.').pop().toLowerCase();
  if (['md', 'txt', 'markdown'].indexOf(ext) === -1) {
    showToast('仅支持 .md / .txt / .markdown 文件');
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e) {
    setPlainInput(e.target.result);
    renderPreview();
    showToast('已加载文件：' + file.name);
  };
  reader.readAsText(file);
}

// ============ 清空 ============
function clearAll() {
  setPlainInput('');
  document.getElementById('fileInput').value = '';
  renderPreview();
}

// ============ 富文本粘贴：保留结构，丢弃来源外观 ============
// ChatGPT 等页面会同时放入 text/html 和 text/plain。textarea 只能接收后者，
// 因而原先的标题、粗体和列表在进入本工具的第一步就已经丢失了。
var inputOrigin = 'text';
function setPlainInput(text) {
  var editor = document.getElementById('inputText');
  editor.textContent = text || '';
  inputOrigin = 'text';
}

function sanitizePastedHtml(html) {
  var source = new DOMParser().parseFromString(html, 'text/html');
  var allowed = { H1:1,H2:1,H3:1,H4:1,H5:1,H6:1,P:1,BR:1,STRONG:1,B:1,EM:1,I:1,DEL:1,
    UL:1,OL:1,LI:1,BLOCKQUOTE:1,PRE:1,CODE:1,A:1,HR:1,TABLE:1,THEAD:1,TBODY:1,TR:1,TH:1,TD:1 };
  function clean(node) {
    if (node.nodeType === Node.TEXT_NODE) return document.createTextNode(node.nodeValue);
    if (node.nodeType !== Node.ELEMENT_NODE) return document.createDocumentFragment();
    var tag = node.tagName.toUpperCase();
    var out = allowed[tag] ? document.createElement(tag.toLowerCase()) : document.createDocumentFragment();
    if (tag === 'A' && allowed[tag]) {
      var href = node.getAttribute('href') || '';
      if (/^(https?:|mailto:)/i.test(href)) { out.setAttribute('href', href); out.setAttribute('target', '_blank'); }
    }
    Array.prototype.forEach.call(node.childNodes, function(child) { out.appendChild(clean(child)); });
    return out;
  }
  var wrapper = document.createElement('div');
  Array.prototype.forEach.call(source.body.childNodes, function(child) { wrapper.appendChild(clean(child)); });
  return wrapper.innerHTML;
}

function htmlToMarkdown(html) {
  var root = document.createElement('div'); root.innerHTML = html;
  function walk(node) {
    if (node.nodeType === Node.TEXT_NODE) return node.nodeValue.replace(/\u00a0/g, ' ');
    if (node.nodeType !== Node.ELEMENT_NODE) return '';
    var tag = node.tagName.toLowerCase();
    var children = Array.prototype.map.call(node.childNodes, walk).join('');
    if (/^h[1-6]$/.test(tag)) return '#'.repeat(Number(tag[1])) + ' ' + children.trim() + '\n\n';
    if (tag === 'p' || tag === 'div') return children.trim() + '\n\n';
    if (tag === 'br') return '\n';
    if (tag === 'strong' || tag === 'b') return '**' + children + '**';
    if (tag === 'em' || tag === 'i') return '*' + children + '*';
    if (tag === 'code' && node.parentElement && node.parentElement.tagName.toLowerCase() !== 'pre') return '`' + children + '`';
    if (tag === 'pre') return '```\n' + node.textContent.replace(/^\n+|\n+$/g, '') + '\n```\n\n';
    if (tag === 'li') return children.trim();
    if (tag === 'ul' || tag === 'ol') return Array.prototype.map.call(node.children, function(li, idx) { return (tag === 'ol' ? (idx + 1) + '. ' : '- ') + walk(li).trim(); }).join('\n') + '\n\n';
    if (tag === 'blockquote') return children.trim().split('\n').map(function(line) { return '> ' + line; }).join('\n') + '\n\n';
    if (tag === 'a') { var href = node.getAttribute('href'); return href ? '[' + children + '](' + href + ')' : children; }
    if (tag === 'hr') return '---\n\n';
    if (tag === 'table') {
      var trNodes = node.querySelectorAll('tr');
      var tmd = '';
      Array.prototype.forEach.call(trNodes, function(row, idx) {
        var cells = row.querySelectorAll('th,td');
        var cellTexts = Array.prototype.map.call(cells, function(cell) {
          return walk(cell).trim().replace(/\|/g, '\\|').replace(/\n/g, ' ');
        });
        if (cellTexts.length === 0) return;
        tmd += '| ' + cellTexts.join(' | ') + ' |\n';
        if (idx === 0) {
          tmd += '| ' + cellTexts.map(function() { return '---'; }).join(' | ') + ' |\n';
        }
      });
      return tmd + '\n';
    }
    return children;
  }
  return Array.prototype.map.call(root.childNodes, walk).join('').replace(/\n{3,}/g, '\n\n').trim();
}

function getInputText() {
  var editor = document.getElementById('inputText');
  // text 路径用 textContent 保真读取；innerText 会按渲染折叠换行和缩进，破坏 Markdown 结构
  return inputOrigin === 'rich' ? htmlToMarkdown(editor.innerHTML) : editor.textContent.replace(/\r/g, '');
}

// ============ 结构识别器 + 强调标注器 ============
// 将原始文本解析为结构化块，保留原始顺序，只标注类型
function parseContent(text) {
  if (!text || !text.trim()) return [];
  var lines = text.split('\n');
  var blocks = [];
  var i = 0;

  while (i < lines.length) {
    var line = lines[i];
    var trimmed = line.trim();

    // 空行
    if (trimmed === '') {
      i++;
      continue;
    }

    // 代码块 ```
    if (trimmed.startsWith('```')) {
      var codeLines = [trimmed];
      i++;
      while (i < lines.length && !lines[i].trim().startsWith('```')) {
        codeLines.push(lines[i]);
        i++;
      }
      if (i < lines.length) { codeLines.push(lines[i]); i++; }
      blocks.push({ type: 'code', content: codeLines.join('\n') });
      continue;
    }

    // Markdown 表格：| col1 | col2 | 后跟 |---|---|
    if (isMarkdownTable(lines, i)) {
      var tableLines = [];
      while (i < lines.length && lines[i].trim() !== '' && lines[i].trim().indexOf('|') !== -1) {
        tableLines.push(lines[i].trim());
        i++;
      }
      blocks.push(parseMarkdownTable(tableLines));
      continue;
    }

    // 箭头流：预扫描判断当前行是否属于箭头流区域
    // 箭头流 = 连续非空行中至少有一行是箭头(↓/→)，且文本行较短
    if (isInArrowFlowRegion(lines, i)) {
      var flowLines = [];
      while (i < lines.length) {
        var tl = lines[i].trim();
        if (tl === '') { i++; break; }
        // 箭头流中的行：箭头行、短文本行（<50字）、含+/|的连接行
        if (isArrowLine(tl) || tl.length < 50) {
          // 如果遇到明显不是箭头流的内容（长段落、列表项、代码），停止
          if (!isArrowLine(tl) && /^([-*•]|\d+[.)]|\(\d+\))\s+/.test(tl)) break;
          if (tl.startsWith('```')) break;
          flowLines.push(tl);
          i++;
        } else {
          break;
        }
      }
      if (flowLines.length >= 2 && flowLines.some(isArrowLine)) {
        blocks.push({ type: 'arrowFlow', content: flowLines });
        continue;
      } else {
        // 不是真正的箭头流，回退处理第一行
        blocks.push({ type: 'paragraph', content: flowLines[0] });
        continue;
      }
    }

    // 多行 display 公式：\[ ... \] 或 $$ ... $$ 跨行时合并为一个段落块，
    // 避免被逐行切块后 KaTeX 无法配对定界符
    if ((/^\\\[/.test(trimmed) && !/\\\]/.test(trimmed)) || (/^\\\(/.test(trimmed) && !/\\\)/.test(trimmed))) {
      var mathLines = [trimmed];
      i++;
      while (i < lines.length) {
        var ml = lines[i].trim();
        mathLines.push(ml);
        i++;
        if (/\\\]$/.test(ml) || /\\\)$/.test(ml)) break;
      }
      blocks.push({ type: 'paragraph', content: mathLines.join(' ') });
      continue;
    }
    if (/^\$\$/.test(trimmed) && trimmed.indexOf('$$', 2) === -1) {
      var ddLines = [trimmed];
      i++;
      while (i < lines.length) {
        var dl = lines[i].trim();
        ddLines.push(dl);
        i++;
        if (/\$\$$/.test(dl)) break;
      }
      blocks.push({ type: 'paragraph', content: ddLines.join(' ') });
      continue;
    }

    // Markdown 标题 ## ###
    var hMatch = /^(#{1,6})\s+(.+)$/.exec(trimmed);
    if (hMatch) {
      blocks.push({ type: 'heading', level: hMatch[1].length, content: hMatch[2] });
      i++;
      continue;
    }

    // 列表项：- * • 数字. (1)——列表标记是强结构信号，优先于标题启发式判断
    var listMatch = /^([-*•]|\d+[.)]|\(\d+\))\s+(.+)$/.exec(trimmed);
    if (listMatch) {
      var listItems = [];
      var listType = /^\d/.test(listMatch[1]) ? 'ol' : 'ul';
      while (i < lines.length) {
        var lm = /^([-*•]|\d+[.)]|\(\d+\))\s+(.+)$/.exec(lines[i].trim());
        if (lm) {
          listItems.push(lm[2]);
          i++;
        } else if (lines[i].trim() === '') {
          // 检查下一行是否还是列表
          if (i + 1 < lines.length && /^([-*•]|\d+[.)]|\(\d+\))\s+/.test(lines[i+1].trim())) {
            i++;
          } else {
            break;
          }
        } else {
          break;
        }
      }
      blocks.push({ type: 'list', listType: listType, items: listItems });
      continue;
    }

    // 标题识别：第X阶段/第X周/Step X/数字.后接冒号/短行无标点
    var titleMatch = isTitleLine(trimmed);
    if (titleMatch) {
      blocks.push({ type: 'heading', level: titleMatch.level, content: trimmed.replace(/[:：]$/, '') });
      i++;
      continue;
    }

    // 结论句/核心问题：包含关键词且较短
    if (isConclusionLine(trimmed)) {
      blocks.push({ type: 'conclusion', content: trimmed });
      i++;
      continue;
    }

    // 重点概念：以 >> 开头或包含「核心/关键/最重要」
    if (trimmed.startsWith('>>') || /(^|[^a-zA-Z])(核心|关键|最重要|重点|注意)([^a-zA-Z]|$)/.test(trimmed) && trimmed.length < 80) {
      blocks.push({ type: 'keyConcept', content: trimmed.replace(/^>>\s*/, '') });
      i++;
      continue;
    }

    // 普通段落
    blocks.push({ type: 'paragraph', content: trimmed });
    i++;
  }

  return blocks;
}

// 检查从第 startIdx 行开始是否是 Markdown 表格
// 判断：当前行包含 |，且下一行是分隔行（只含 |,-,:,空格）
function isMarkdownTable(lines, startIdx) {
  if (startIdx + 1 >= lines.length) return false;
  var line1 = lines[startIdx].trim();
  var line2 = lines[startIdx + 1] ? lines[startIdx + 1].trim() : '';
  if (line1.indexOf('|') === -1) return false;
  if (!/^\|?[\s\-:|]+$/.test(line2)) return false;
  if (line2.indexOf('-') === -1) return false;
  return true;
}

function parseMarkdownTable(tableLines) {
  var headers = splitTableRow(tableLines[0]);
  var rows = [];
  for (var r = 2; r < tableLines.length; r++) {
    rows.push(splitTableRow(tableLines[r]));
  }
  return { type: 'table', headers: headers, rows: rows };
}

function splitTableRow(line) {
  line = line.trim();
  if (line.charAt(0) === '|') line = line.slice(1);
  if (line.charAt(line.length - 1) === '|') line = line.slice(0, -1);
  return line.split('|').map(function(cell) { return cell.trim(); });
}

function isArrowLine(line) {
  if (line === '↓' || line === '→' || line === '|') return true;
  if (/^[↓→\s|]+$/.test(line) && line.length < 10) return true;
  return false;
}

// 检查从第 startIdx 行开始是否属于箭头流区域
// 判断逻辑：从当前行向后扫描，在遇到空行之前，是否有至少一个箭头行
function isInArrowFlowRegion(lines, startIdx) {
  var count = 0;
  for (var j = startIdx; j < lines.length && count < 20; j++) {
    var tl = lines[j].trim();
    if (tl === '') break;
    // 遇到代码块、列表项、长段落，不是箭头流
    if (tl.startsWith('```')) break;
    if (/^([-*•]|\d+[.)]|\(\d+\))\s+/.test(tl)) break;
    if (tl.length > 50) break;
    if (isArrowLine(tl)) return true;
    count++;
  }
  return false;
}

function isTitleLine(line) {
  // 第X阶段/第X部分
  if (/^第[一二三四五六七八九十\d]+(阶段|部分|章|节|周)/.test(line)) return { level: 1 };
  // Step X / 步骤X
  if (/^(Step\s*\d+|步骤\s*\d+)/i.test(line)) return { level: 2 };
  // Module X / 模块X
  if (/^(Module\s*\d+|模块\s*\d+)/i.test(line)) return { level: 2 };
  // 方法X：/ 问题X：
  if (/^(方法|问题|方向)\s*\d+\s*[:：]/.test(line)) return { level: 2 };
  // 短行（3-25字）无尾标点，且不含箭头，可能是标题
  // 排除：以常见连词开头的句子、纯英文单词、问句
  if (line.length >= 3 && line.length < 25 && !/[。，；！？、]$/.test(line) && !/[↓→]/.test(line)) {
    if (/[\u4e00-\u9fff]/.test(line)) {
      // 排除看起来像普通句子的开头
      if (!/^(所以|于是|但是|因为|如果|那么|例如|比如|不过|而且|并且|简单说|注意|问题[：:])/.test(line)) {
        // 排除问句（包含？的）
        if (!/[?？]/.test(line)) {
          return { level: 3 };
        }
      }
    }
  }
  return null;
}

function isConclusionLine(line) {
  if (line.length > 120) return false;
  var keywords = ['核心问题', '目标是', '目标：', '总结', '所以核心', '这是整个', '真正的问题', '真正解决'];
  for (var k = 0; k < keywords.length; k++) {
    if (line.indexOf(keywords[k]) !== -1) return true;
  }
  return false;
}

// ============ 行内高亮处理 ============
function highlightInline(text) {
  // 富文本来源已有作者明确标注的粗体/斜体；不再用关键词二次猜测重点。
  if (inputOrigin === 'rich') return renderInlineMarkdown(text);
  var config = getTemplateConfig();
  if (!config.inlineHighlight) {
    return renderInlineMarkdown(text);
  }
  // 高亮关键词
  var keywords = ['核心', '关键', '最重要', '重点', '注意', '不要', '错误', '失败'];
  var result = escapeHtml(text);
  keywords.forEach(function(kw) {
    var re = new RegExp(kw, 'g');
    result = result.replace(re, '<span class="highlight-word">' + kw + '</span>');
  });
  return renderInlineMarkdown(result, true);
}

function renderInlineMarkdown(text, alreadyEscaped) {
  var result = alreadyEscaped ? text : escapeHtml(text);
  // 保护 LaTeX 公式，避免被 * ` 等 markdown 正则误伤
  var mathStore = [];
  function stashMath(match) {
    mathStore.push(match);
    return '\uF000' + (mathStore.length - 1) + '\uF001';
  }
  result = result.replace(/\$\$([\s\S]+?)\$\$/g, stashMath);
  result = result.replace(/\\\[([\s\S]+?)\\\]/g, stashMath);
  result = result.replace(/\\\(([\s\S]+?)\\\)/g, stashMath);
  result = result.replace(/\$([^$\n]+?)\$/g, stashMath);
  // 处理 markdown 行内语法
  result = result.replace(/`([^`]+)`/g, '<code>$1</code>');
  result = result.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  result = result.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '<em>$1</em>');
  result = result.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // 还原 LaTeX 公式（由 KaTeX auto-render 在 DOM 渲染后处理）
  result = result.replace(/\uF000(\d+)\uF001/g, function(m, idx) {
    return mathStore[parseInt(idx, 10)];
  });
  return result;
}

function escapeHtml(text) {
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ============ 模板渲染器 ============
function renderBlocks(blocks) {
  var html = '';
  stats = { headings: 0, conclusions: 0, arrowFlows: 0 };

  blocks.forEach(function(block) {
    switch (block.type) {
      case 'heading':
        stats.headings++;
        html += '<h' + Math.min(block.level + 1, 6) + '>' + highlightInline(block.content) + '</h' + Math.min(block.level + 1, 6) + '>';
        break;
      case 'conclusion':
        stats.conclusions++;
        html += '<div class="conclusion">' + highlightInline(block.content) + '</div>';
        break;
      case 'keyConcept':
        var kcConfig = getTemplateConfig();
        var kcPrefix = kcConfig.hardPrefix ? kcConfig.hardPrefix : '';
        html += '<div class="key-concept">' + kcPrefix + highlightInline(block.content) + '</div>';
        break;
      case 'callout':
        html += '<div class="callout">' + highlightInline(block.content) + '</div>';
        break;
      case 'arrowFlow':
        stats.arrowFlows++;
        var flowHtml = block.content.map(function(line) {
          if (isArrowLine(line)) return '<span class="arrow">' + escapeHtml(line) + '</span>';
          return escapeHtml(line);
        }).join('<br>');
        html += '<div class="arrow-flow">' + flowHtml + '</div>';
        break;
      case 'list':
        var tag = block.listType;
        html += '<' + tag + '>';
        block.items.forEach(function(item) {
          html += '<li>' + highlightInline(item) + '</li>';
        });
        html += '</' + tag + '>';
        break;
      case 'table':
        var tHtml = '<table><thead><tr>';
        block.headers.forEach(function(h) { tHtml += '<th>' + highlightInline(h) + '</th>'; });
        tHtml += '</tr></thead><tbody>';
        block.rows.forEach(function(row) {
          tHtml += '<tr>';
          row.forEach(function(cell) { tHtml += '<td>' + highlightInline(cell) + '</td>'; });
          tHtml += '</tr>';
        });
        tHtml += '</tbody></table>';
        html += tHtml;
        break;
      case 'code':
        var codeContent = block.content.replace(/^```\w*\n?/, '').replace(/\n?```$/, '');
        html += '<pre><code>' + escapeHtml(codeContent) + '</code></pre>';
        break;
      case 'paragraph':
      default:
        html += '<p>' + highlightInline(block.content) + '</p>';
        break;
    }
  });

  return html;
}

// ============ 实时预览 ============
var inputText = document.getElementById('inputText');
var preview = document.getElementById('preview');
var debounceTimer = null;

inputText.addEventListener('input', function() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(renderPreview, 300);
});

inputText.addEventListener('paste', function(event) {
  var clipboard = event.clipboardData;
  var html = clipboard && clipboard.getData('text/html');
  event.preventDefault();
  if (html) {
    var safeHtml = sanitizePastedHtml(html);
    if (safeHtml.trim()) {
      inputText.innerHTML = safeHtml;
      inputOrigin = 'rich';
      renderPreview();
      showToast('已保留标题、粗体、列表等结构；已统一来源字号与行距');
      return;
    }
  }
  // 纯文本/Markdown：走 setPlainInput，保证换行与缩进以纯文本节点保真保存
  setPlainInput(clipboard ? clipboard.getData('text/plain') : '');
  renderPreview();
});

document.getElementById('template').addEventListener('change', renderPreview);

function renderPreview() {
  var template = document.getElementById('template').value;
  preview.setAttribute('data-template', template);
  var text = getInputText();
  if (!text.trim()) {
    preview.innerHTML = '<div class="placeholder">在左侧粘贴或上传 Agent 回答<br>右侧将实时显示增强排版后的预览</div>';
    parsedBlocks = [];
    updateStatus();
    setExportButtons(false);
    return;
  }

  parsedBlocks = parseContent(text);
  var html = renderBlocks(parsedBlocks);
  preview.innerHTML = html;
  // KaTeX 渲染 LaTeX 公式
  if (typeof renderMathInElement !== 'undefined') {
    renderMathInElement(preview, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '\\[', right: '\\]', display: true },
        { left: '\\(', right: '\\)', display: false },
        { left: '$', right: '$', display: false }
      ],
      throwOnError: false
    });
  }
  updateStatus();
  setExportButtons(true);
}

function updateStatus() {
  document.getElementById('statusLeft').textContent =
    parsedBlocks.length > 0 ? '已解析 ' + parsedBlocks.length + ' 个内容块' : '就绪';
  document.getElementById('statusRight').textContent =
    '识别：' + stats.headings + ' 标题 / ' + stats.conclusions + ' 结论 / ' + stats.arrowFlows + ' 箭头流';
}

function setExportButtons(enabled) {
  var btns = ['exportDocx', 'exportPdf', 'exportHtml', 'exportMd'];
  btns.forEach(function(id) {
    document.getElementById(id).disabled = !enabled;
  });
}

// ============ 导出：Markdown ============
function exportMd() {
  if (parsedBlocks.length === 0) { showToast('没有内容可导出'); return; }
  var md = '';
  parsedBlocks.forEach(function(block) {
    switch (block.type) {
      case 'heading':
        md += '\n' + '#'.repeat(block.level) + ' ' + block.content + '\n\n';
        break;
      case 'conclusion':
      case 'keyConcept':
        md += '> **' + block.content + '**\n\n';
        break;
      case 'callout':
        md += '> *' + block.content + '*\n\n';
        break;
      case 'arrowFlow':
        md += '```\n' + block.content.join('\n') + '\n```\n\n';
        break;
      case 'table':
        md += '| ' + block.headers.join(' | ') + ' |\n';
        md += '| ' + block.headers.map(function() { return '---'; }).join(' | ') + ' |\n';
        block.rows.forEach(function(row) {
          md += '| ' + row.join(' | ') + ' |\n';
        });
        md += '\n';
        break;
      case 'list':
        block.items.forEach(function(item, idx) {
          if (block.listType === 'ol') {
            md += (idx + 1) + '. ' + item + '\n';
          } else {
            md += '- ' + item + '\n';
          }
        });
        md += '\n';
        break;
      case 'code':
        md += block.content + '\n\n';
        break;
      default:
        md += block.content + '\n\n';
    }
  });
  var blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  saveAs(blob, getFilename('md'));
  showToast('Markdown 已导出');
}

// ============ 导出：PDF ============
function exportPdf() {
  if (parsedBlocks.length === 0) { showToast('没有内容可导出'); return; }
  if (typeof html2pdf === 'undefined') {
    showToast('PDF 库未加载，请检查网络');
    return;
  }
  showToast('正在生成 PDF...', 5000);
  var contentHtml = renderBlocks(parsedBlocks);
  var tempDiv = document.createElement('div');
  tempDiv.style.cssText = 'max-width:700px;margin:0 auto;padding:20px;font-family:-apple-system,"Microsoft YaHei",Arial,sans-serif;color:#333;';
  tempDiv.innerHTML = '<style>' + getExportStyles() + '</style>' + contentHtml;
  // 渲染 LaTeX 公式到临时容器（KaTeX CSS 已在主页面加载）
  if (typeof renderMathInElement !== 'undefined') {
    renderMathInElement(tempDiv, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '\\[', right: '\\]', display: true },
        { left: '\\(', right: '\\)', display: false },
        { left: '$', right: '$', display: false }
      ],
      throwOnError: false
    });
  }

  var opt = {
    margin: [15, 15, 15, 15],
    filename: getFilename('pdf'),
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: 'avoid-all' }
  };
  html2pdf().set(opt).from(tempDiv).save().then(function() {
    showToast('PDF 已导出');
  }).catch(function(err) {
    showToast('PDF 生成失败：' + err.message);
  });
}

// ============ 导出：DOCX ============
function exportDocx() {
  if (parsedBlocks.length === 0) { showToast('没有内容可导出'); return; }
  if (typeof docx === 'undefined') {
    showToast('DOCX 库未加载，请检查网络');
    return;
  }
  showToast('正在生成 DOCX...', 5000);

  try {
    var docxLib = docx;
    var config = getTemplateConfig();
    var children = [];

    parsedBlocks.forEach(function(block) {
      switch (block.type) {
        case 'heading':
          var headingLevel = Math.min(block.level, 3);
          children.push(new docxLib.Paragraph({
            children: buildParagraphRuns(block.content, { bold: true, size: headingLevel === 1 ? config.h1Size : (headingLevel === 2 ? config.h2Size : config.h3Size), color: headingLevel === 1 ? config.h1Color : (headingLevel === 2 ? config.h2Color : config.h3Color), font: config.headingFont }),
            spacing: { before: headingLevel === 1 ? 280 : (headingLevel === 2 ? 200 : 160), after: headingLevel === 1 ? 100 : (headingLevel === 2 ? 80 : 60), line: 260 }
          }));
          break;

        case 'conclusion':
          children.push(new docxLib.Paragraph({
            children: buildParagraphRuns(block.content, { bold: config.name === 'academic', italics: config.name !== 'academic', size: config.bodySize, color: config.conclusionColor, font: config.bodyFont }),
            spacing: { before: 80, after: 80, line: 280 },
            shading: { fill: config.conclusionBg, type: docxLib.ShadingType.CLEAR },
            indent: { left: 360 }
          }));
          break;

        case 'keyConcept':
          children.push(new docxLib.Paragraph({
            children: buildParagraphRuns((config.hardPrefix || '') + block.content, { bold: true, size: config.bodySize, color: config.hardColor, font: config.bodyFont }),
            spacing: { before: 60, after: 60, line: 280 },
            shading: { fill: config.hardBg, type: docxLib.ShadingType.CLEAR },
            indent: { left: 360 }
          }));
          break;

        case 'callout':
          children.push(new docxLib.Paragraph({
            children: buildParagraphRuns(block.content, { italics: true, size: config.bodySize, color: config.softColor, font: config.bodyFont }),
            spacing: { before: 60, after: 60, line: 280 },
            shading: { fill: config.softBg, type: docxLib.ShadingType.CLEAR },
            indent: { left: 360 }
          }));
          break;

        case 'arrowFlow':
          var flowText = block.content.join('  ' + String.fromCharCode(0x2193) + '  ');
          // 更精确：按行渲染，箭头行用箭头符号
          var flowRuns = [];
          block.content.forEach(function(line, idx) {
            if (idx > 0) {
              flowRuns.push(new docxLib.TextRun({
                text: ' ',
                break: 1,
                font: config.bodyFont
              }));
            }
            if (isArrowLine(line)) {
              flowRuns.push(new docxLib.TextRun({
                text: line,
                bold: true,
                size: config.bodySize,
                color: config.arrowArrowColor,
                font: config.bodyFont
              }));
            } else {
              flowRuns.push(new docxLib.TextRun({
                text: line,
                bold: true,
                size: config.bodySize,
                color: config.arrowColor,
                font: config.bodyFont
              }));
            }
          });
          var arrowPara = {
            children: flowRuns,
            alignment: docxLib.AlignmentType.CENTER,
            spacing: { before: 80, after: 80, line: 300 }
          };
          if (config.arrowBg) {
            arrowPara.shading = { fill: config.arrowBg, type: docxLib.ShadingType.CLEAR };
          }
          children.push(new docxLib.Paragraph(arrowPara));
          break;

        case 'list':
          block.items.forEach(function(item) {
            children.push(new docxLib.Paragraph({
              children: buildParagraphRuns((block.listType === 'ol' ? '\u2022 ' : '\u2022 ') + item),
              spacing: { after: 40, line: 240 },
              indent: { left: 360 }
            }));
          });
          break;

        case 'table':
          var headerRow = new docxLib.TableRow({
            tableHeader: true,
            children: block.headers.map(function(h) {
              return new docxLib.TableCell({
                shading: { fill: config.h1Color, type: docxLib.ShadingType.CLEAR },
                children: [new docxLib.Paragraph({
                  children: buildParagraphRuns(h, { bold: true, size: config.bodySize, color: 'FFFFFF', font: config.bodyFont })
                })]
              });
            })
          });
          var dataRows = block.rows.map(function(row) {
            return new docxLib.TableRow({
              children: row.map(function(cell) {
                return new docxLib.TableCell({
                  children: [new docxLib.Paragraph({
                    children: buildParagraphRuns(cell, { size: config.bodySize, color: config.bodyColor, font: config.bodyFont })
                  })]
                });
              })
            });
          });
          children.push(new docxLib.Table({
            rows: [headerRow].concat(dataRows),
            width: { size: 100, type: docxLib.WidthType.PERCENTAGE }
          }));
          break;

        case 'code':
          var codeBg = config.name === 'kami' ? 'EFEEE6' : 'F6F8FA';
          children.push(new docxLib.Paragraph({
            children: [new docxLib.TextRun({
              text: block.content.replace(/^```\w*\n?/, '').replace(/\n?```$/, ''),
              size: 20,
              color: config.bodyColor,
              font: { ascii: 'Courier New', hAnsi: 'Courier New' }
            })],
            spacing: { before: 60, after: 60, line: 240 },
            shading: { fill: codeBg, type: docxLib.ShadingType.CLEAR }
          }));
          break;

        case 'paragraph':
        default:
          // 处理行内高亮：将含关键词的段落拆分
          var paraRuns = buildParagraphRuns(block.content);
          children.push(new docxLib.Paragraph({
            children: paraRuns,
            spacing: { after: 60, line: 260 }
          }));
          break;
      }
    });

    var doc = new docxLib.Document({
      styles: {
        default: {
          document: {
            run: {
              font: config.bodyFont,
              size: config.bodySize,
              color: config.bodyColor
            }
          }
        }
      },
      sections: [{
        properties: {
          page: {
            size: { width: 11906, height: 16838 },
            margin: { top: 1440, right: 1440, bottom: 1440, left: 1440 }
          }
        },
        children: children
      }]
    });

    docxLib.Packer.toBlob(doc).then(function(blob) {
      saveAs(blob, getFilename('docx'));
      showToast('DOCX 已导出');
    }).catch(function(err) {
      showToast('DOCX 生成失败：' + err.message);
    });
  } catch (err) {
    showToast('DOCX 生成出错：' + err.message);
    console.error(err);
  }
}

// 构建 DOCX 行内 runs：优先还原来源明确给出的粗体/斜体/代码，而非重新猜重点。
// LaTeX 公式去掉外层分隔符后用 Cambria Math 斜体显示（docx 不支持原生 LaTeX 渲染）。
function buildParagraphRuns(text, base) {
  var config = getTemplateConfig();
  base = base || { size: config.bodySize, color: config.bodyColor, font: config.bodyFont };
  // 保护 LaTeX 公式，避免被 * ` 等 markdown 正则误伤
  var mathStore = [];
  var processed = String(text);
  function stashMath(inner) { mathStore.push(inner); return '\uF000' + (mathStore.length - 1) + '\uF001'; }
  processed = processed.replace(/\$\$([\s\S]+?)\$\$/g, function(m, inner) { return stashMath(inner); });
  processed = processed.replace(/\\\[([\s\S]+?)\\\]/g, function(m, inner) { return stashMath(inner); });
  processed = processed.replace(/\\\(([\s\S]+?)\\\)/g, function(m, inner) { return stashMath(inner); });
  processed = processed.replace(/\$([^$\n]+?)\$/g, function(m, inner) { return stashMath(inner); });

  var parts = processed.split(/(\*\*[^*]+\*\*|`[^`]+`|(?<!\*)\*[^*\n]+\*(?!\*)|\uF000\d+\uF001)/g);
  return parts.filter(function(part) { return part !== ''; }).map(function(part) {
    var mathMatch = /^\uF000(\d+)\uF001$/.exec(part);
    if (mathMatch) {
      return new docx.TextRun(Object.assign({}, base, {
        text: mathStore[parseInt(mathMatch[1], 10)],
        italics: true,
        font: { ascii: 'Cambria Math', hAnsi: 'Cambria Math' }
      }));
    }
    var options = Object.assign({}, base, { text: part });
    if (/^\*\*[^*]+\*\*$/.test(part)) { options.text = part.slice(2, -2); options.bold = true; }
    else if (/^`[^`]+`$/.test(part)) { options.text = part.slice(1, -1); options.font = { ascii: 'Courier New', hAnsi: 'Courier New' }; }
    else if (/^\*[^*\n]+\*$/.test(part)) { options.text = part.slice(1, -1); options.italics = true; }
    return new docx.TextRun(options);
  });
}

// ============ 文件名生成 ============
function getFilename(ext) {
  var now = new Date();
  var dateStr = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0');
  return 'agent回答_' + dateStr + '.' + ext;
}
